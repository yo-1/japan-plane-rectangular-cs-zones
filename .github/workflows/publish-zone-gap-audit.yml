name: Publish zone gap investigation

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-zone-gap-audit-20261015
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned audit libraries
        run: python -m pip install -r scripts/geometry_audit/requirements.txt
      - name: Download pinned public zone reference
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p output/gap-inputs
          gh release download v2026.2 --pattern plane_rectangular_zones_2026.zip --dir output/gap-inputs
          python - <<'PY'
          import hashlib,zipfile
          from pathlib import Path
          p=Path('output/gap-inputs/plane_rectangular_zones_2026.zip')
          with p.open('rb') as f:
              assert hashlib.file_digest(f,'sha256').hexdigest()=='c32ac8417ee604436e0a20280a6f2d3a1e73a3247c5a8db10230209daf9e3fbd'
          with zipfile.ZipFile(p) as z:
              names=[n for n in z.namelist() if n.endswith('.gpkg')]
              assert len(names)==1
              with z.open(names[0]) as src, Path('output/gap-inputs/plane_rectangular_zones_2026.gpkg').open('xb') as dst:
                  import shutil
                  shutil.copyfileobj(src,dst)
          PY
      - name: Restore recorded investigation and verify every feature value
        run: >-
          python scripts/restore_zone_gap_snapshot.py
          --zones output/gap-inputs/plane_rectangular_zones_2026.gpkg
      - name: Include original report tables alongside restored geometry
        run: |
          python - <<'PY'
          from pathlib import Path
          import shutil
          base=Path('docs/zone-gap-audit-20261015')
          for name in ['summary.json','candidates.csv','zone-comparison.csv','exterior-preservation.csv','artifact-validation.json']:
              shutil.copyfile(base/name,Path('output/zone-gap-audit-20261015')/name)
          shutil.copyfile(base/'municipality-summary.json','output/n03-municipality-recheck-20261015/summary.json')
          shutil.copyfile(base/'municipality-comparison.csv','output/n03-municipality-recheck-20261015/comparison.csv')
          shutil.copyfile(base/'exterior-summary.json','output/zone-exterior-screen-20261015/summary.json')
          shutil.copyfile(base/'exterior-screen.csv.gz','output/zone-exterior-screen-20261015/exterior-screen.csv.gz')
          shutil.copyfile(base/'rock-followup/source-ring-evidence.json','output/rock-followup-20261015/source-ring-evidence.json')
          PY
      - name: Create typed copies and verify all feature values and GDAL read-back
        run: >-
          python scripts/prepare_arcgis_comparison.py
          --input output/zone-gap-audit-20261015/candidates.gpkg
          --input output/n03-municipality-recheck-20261015/differences.gpkg
          --input output/zone-exterior-screen-20261015/exterior-screen.gpkg
          --input output/rock-followup-20261015/source-ring-evidence.gpkg
          --input docs/zone-gap-audit-20261015/rock-followup/vector-context/vector-context.gpkg
          --output output/arcgis-comparison-20261015
      - name: Compile and test (original DBF is outside this publication snapshot)
        run: |
          python -m compileall -q scripts tests
          python -m unittest discover -s tests -v
      - name: Package and verify ZIP members
        run: python scripts/package_zone_gap_release.py --output output/zone-gap-release-20261015
      - uses: actions/upload-artifact@v4
        with:
          name: verified-zone-gap-release
          path: |
            output/zone-gap-release-20261015/*.zip
            output/zone-gap-release-20261015/*.txt
            output/zone-gap-release-20261015/package-verification.json
          if-no-files-found: error
          retention-days: 14

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: verified-zone-gap-release
          path: output/zone-gap-release-20261015
      - name: Upload, verify remote digests, publish investigation prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/publish_zone_gap_release.py --directory output/zone-gap-release-20261015
